name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag, for example v0.1.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize generated logo
        if: hashFiles('assets/res-bot-icon.png.base64') != ''
        shell: pwsh
        run: |
          $encoded = Get-Content assets/res-bot-icon.png.base64 -Raw
          $bytes = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes('assets/res-bot-icon.png', $bytes)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm assets/res-bot-icon.png.base64
          git add assets/res-bot-icon.png
          git commit -m "Materialize generated logo asset"
          git push

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: res-bot-windows-x64
          path: target/release/res-bot.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.release_tag }}") {
            "${{ inputs.release_tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          gh release create $tag target/release/res-bot.exe `
            --target "${{ github.sha }}" `
            --title "res-bot $tag" `
            --generate-notes
