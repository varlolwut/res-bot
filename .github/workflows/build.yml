name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag, for example v0.1.0
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/res-bot.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  res-bot.exe" | Set-Content target/release/SHA256SUMS.txt -Encoding ascii

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: res-bot-windows-x64
          path: |
            target/release/res-bot.exe
            target/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.release_tag }}") {
            "${{ inputs.release_tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          gh release create $tag `
            target/release/res-bot.exe `
            target/release/SHA256SUMS.txt `
            --target "${{ github.sha }}" `
            --title "res-bot $tag" `
            --generate-notes
